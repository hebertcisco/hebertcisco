name: Build resume

on:
  push:
    branches: [main]
    paths:
      - resumes/**
  pull_request:
    paths:
      - resumes/**
permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      # Discovers every resume file so new resumes are picked up automatically.
      - name: List resumes
        id: list
        run: |
          files=$(find resumes -maxdepth 1 -name '*.yaml' -printf '%f\n' | sed 's/\.yaml$//' | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=$files" >> "$GITHUB_OUTPUT"

  resume:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resume: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      # Derives the output file name from basics.name (e.g. "Hebert Barros" -> "hebert_barros").
      - name: Extract resume owner name
        id: person
        env:
          RESUME_FILE: resumes/${{ matrix.resume }}.yaml
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, unicodedata

          with open(os.environ["RESUME_FILE"], encoding="utf-8") as f:
              text = f.read()

          match = re.search(r"^\s*name:\s*(.+)$", text, re.MULTILINE)
          name = match.group(1).strip()
          normalized = unicodedata.normalize("NFKD", name).encode("ascii", "ignore").decode("ascii")
          snake = re.sub(r"[^a-z0-9]+", "_", normalized.lower()).strip("_")
          print(f"snake_name={snake}")
          PY

      - name: Build resume
        id: resumec
        uses: hebertcisco/resumec-action@v1.0.0
        with:
          input: resumes/${{ matrix.resume }}.yaml
          format: pdf
          theme: modern
          output-dir: dist/${{ matrix.resume }}
          output-name: ${{ steps.person.outputs.snake_name }}

      - name: Upload generated files
        uses: actions/upload-artifact@v7
        with:
          name: resume-${{ matrix.resume }}
          path: ${{ steps.resumec.outputs.output-dir }}
          if-no-files-found: error

  release:
    needs: [discover, resume]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built resumes
        uses: actions/download-artifact@v7
        with:
          path: dist

      # Flattens artifacts into unique filenames since each resume shares the same output names.
      - name: Flatten release assets
        run: |
          mkdir -p release-assets
          find dist -type f | while read -r file; do
            resume=$(basename "$(dirname "$file")" | sed 's/^resume-//')
            cp "$file" "release-assets/${resume}-$(basename "$file")"
          done

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-resumes
          name: Latest resumes
          files: release-assets/*